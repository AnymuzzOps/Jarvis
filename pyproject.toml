[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "1.0.0"
description = "Asistente de escritorio local en español"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8.3,<6.9",
    "sounddevice>=0.5,<0.6",
    "soundfile>=0.13,<0.14",
    "numpy>=2,<3",
    "piper-tts>=1.8,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
